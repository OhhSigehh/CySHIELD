<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Final Test - CyberShield</title>
  <link rel="shortcut icon" type="x-icon" href="logo.jpg" />
  <style>
  :root {
    --bg: #0d1117;
    --bg-soft: #010409;
    --card: #161b22;
    --primary: #1f6feb;
    --accent: #0a58ca;
    --text: #c9d1d9;
    --text-muted: #8b949e;
    --border: #30363d;
  }

  body {
    font-family: "Inter", sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    padding: 20px;
  }

  h1, h2 {
    text-align: center;
    color: var(--primary);
    margin-bottom: 0.5rem;
  }

  .test-box {
    max-width: 900px;
    margin: 30px auto;
    background: var(--card);
    padding: 24px;
    border: 1px solid var(--border);
    border-radius: 12px;
  }

  #testIntro {
    text-align: center;
    color: var(--text-muted);
    margin-bottom: 1.5rem;
  }

  .question {
    margin: 20px 0;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
  }

  .question b {
    display: block;
    margin-bottom: 8px;
  }

  label {
    display: block;
    margin: 6px 0;
    cursor: pointer;
    color: var(--text-muted);
  }

  input[type="radio"] {
    margin-right: 6px;
  }

  button {
      display:flex;
      justify-content: center;
      margin:0 auto;
      font-family: 'Orbitron', serif;
      background: #1f6feb;
      border: 1px solid #1f6feb;
      max-width: 50%;
      padding: 0.5rem 1rem;
      border-radius: 0.6rem;
      color: #fff;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.2sy0ease;
  }

  button:hover {
      box-shadow: 0 0 8px #0a58cb;
  }

  #result {
    text-align: center;
    margin-top: 20px;
    font-size: 1.1rem;
    color: var(--text);
  }
</style>
</head>
<body>
  <h1>Final Test</h1>
  <div class="test-box">
    <h2>Comprehensive Assessment</h2>
    <p id="testIntro">This is the final test of CyberShield. It covers all 6 lessons. Answer carefully!</p>
    <form id="finalForm"></form>
    <div id="result"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDcy8AV_IMrphBOihSwT461C2_CmhHAZi4",
      authDomain: "cshield-41518.firebaseapp.com",
      projectId: "cshield-41518",
      storageBucket: "cshield-41518.firebasestorage.app",
      messagingSenderId: "1055312271929",
      appId: "1:1055312271929:web:c3415a674782ade5550be8"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const questions = [
      { q:"What is the main goal of cybersecurity?", options:["Protect data and users","Make devices faster"], correct:0 },
      { q:"You receive an urgent email asking for your login details. What type of attack is this?", options:["Phishing","System update"], correct:0 },
      { q:"Why is using the same password for multiple accounts dangerous?", options:["One breach can affect all accounts","It slows login speed"], correct:0 },
      { q:"What should you do when you see a suspicious pop-up warning?", options:["Close it without clicking","Download the fix"], correct:0 },
      { q:"Which practice best protects online accounts?", options:["Two-factor authentication","Using simple passwords"], correct:0 },

      { q:"What is malware?", options:["Malicious software","Helpful system tool"], correct:0 },
      { q:"Why is public Wi-Fi risky?", options:["Data can be intercepted","It is always slow"], correct:0 },
      { q:"What is a fake login page designed to do?", options:["Steal credentials","Improve security"], correct:0 },
      { q:"Which is an example of personal data?", options:["Home address","Favorite color"], correct:0 },
      { q:"Why should unused online accounts be deleted?", options:["Reduce security risks","Save battery"], correct:0 },

      { q:"What does ethical hacking require?", options:["Permission and responsibility","Secrecy"], correct:0 },
      { q:"A security weakness in a system is called what?", options:["Vulnerability","Firewall"], correct:0 },
      { q:"What is the first step after an account breach?", options:["Change passwords","Ignore it"], correct:0 },
      { q:"Why is saving evidence important during cyber incidents?", options:["For investigation and reporting","To share online"], correct:0 },
      { q:"Which role focuses on monitoring security threats?", options:["Security analyst","Game developer"], correct:0 },

      { q:"What is phishing often disguised as?", options:["Legitimate messages","Spam ads"], correct:0 },
      { q:"Which habit best improves online safety?", options:["Thinking before clicking","Clicking quickly"], correct:0 },
      { q:"What should you do if you are cyberbullied?", options:["Save evidence and report","Fight back online"], correct:0 },
      { q:"Why are software updates important?", options:["They fix security flaws","They add viruses"], correct:0 },
      { q:"What is a digital footprint?", options:["Your online activity trail","Your device storage"], correct:0 },

      { q:"What is ransomware?", options:["Malware that demands payment","Free security software"], correct:0 },
      { q:"Which tool helps manage strong passwords?", options:["Password manager","Notes app"], correct:0 },
      { q:"What does HTTPS indicate?", options:["A secure website connection","A faster website"], correct:0 },
      { q:"What is social engineering?", options:["Manipulating people to gain access","Writing code"], correct:0 },
      { q:"Cybersecurity is everyone’s responsibility because:", options:["Anyone can be a target","Only experts are attacked"], correct:0 }
    ];

    function shuffle(arr){ for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];} return arr;}

    async function loadFinalTest(user) {
      const ref = doc(db, "users", user.uid, "progress", "lessons");
      const snap = await getDoc(ref);

      if (snap.exists() && snap.data().finalTest) {
        // Already taken
        document.getElementById("finalForm").innerHTML = "";
        document.getElementById("testIntro").textContent = "⚠ You have already completed the Final Test.";
        document.getElementById("result").innerHTML = `Your score: ${snap.data().finalScore}/25`;
        return;
      }

      // Otherwise, show the test
      const selected = shuffle([...questions]).slice(0,25);
      const form = document.getElementById("finalForm");
      selected.forEach((item,i)=>{
        const div=document.createElement("div");
        div.className="question";
        div.innerHTML=`<b>${i+1}. ${item.q}</b>`;
        item.options.forEach((opt,idx)=>{
          const label=document.createElement("label");
          label.innerHTML=`<input type="radio" name="q${i}" value="${idx}"> ${opt}`;
          div.appendChild(label);
        });
        form.appendChild(div);
      });

      const submitBtn=document.createElement("button");
      submitBtn.type="button";
      submitBtn.textContent="Submit";
      submitBtn.onclick=()=>submitFinal(user,selected);
      form.appendChild(submitBtn);
    }

    async function submitFinal(user,selected){
      let score=0;
      selected.forEach((item,i)=>{
        const chosen=document.querySelector(`input[name="q${i}"]:checked`);
        if(chosen && parseInt(chosen.value)===item.correct){score++;}
      });

      const result=document.getElementById("result");
      if(score>=20){
        result.innerHTML=`You passed! Score: ${score}/25`;
        if(user){
          const ref=doc(db,"users",user.uid,"progress","lessons");
          const snap=await getDoc(ref);
          let data=snap.exists()?snap.data():{};
          data.finalTest=true;
          data.finalScore=score;
          await setDoc(ref,data);
        }
        localStorage.setItem("lessonPassed","Final Test completed!");
        setTimeout(()=>window.location.href="results.html",2000);
      } else {
        result.innerHTML=`⚠ You scored ${score}/25. You need at least 20 to pass.`;
        setTimeout(()=>window.location.href="results.html",2000);
      }
    }

    onAuthStateChanged(auth,(user)=>{
      if(user){ loadFinalTest(user); }
      else { window.location.href="index.html"; }
    });
  </script>
</body>
</html>
